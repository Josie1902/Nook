services:
  # ---------------------------------------------------------
  # Main Services: DB, API, Frontend
  # ---------------------------------------------------------
  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}

      # PostgreSQL
      # Used by Better Auth
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Browser → API
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  # ---------------------------------------------------------
  # Optional Services: Admin Tools
  # ---------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------
  # SeaweedFS
  # ---------------------------------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - master
      - -ip=seaweedfs-master
      - -ip.bind=0.0.0.0
    ports:
      - "${SEAWEEDFS_MASTER_PORT}:9333"
    volumes:
      - seaweedfs_master_data:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - volume
      - -ip=seaweedfs-volume
      - -master=seaweedfs-master:9333
      - -ip.bind=0.0.0.0
      - -port=8080
      - -dir=/data
    ports:
      - "${SEAWEEDFS_VOLUME_PORT}:8080"
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_started

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - filer
      - -ip=seaweedfs-filer
      - -master=seaweedfs-master:9333
      - -ip.bind=0.0.0.0
    ports:
      - "${SEAWEEDFS_FILER_PORT}:8888"
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - s3
      - -filer=seaweedfs-filer:8888
      - -ip.bind=0.0.0.0
      - -port=8333
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"
    depends_on:
      seaweedfs-filer:
        condition: service_started

  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - admin
      - -master=seaweedfs-master:9333
      - -ip.bind=0.0.0.0
      - -port=23646
    ports:
      - "${SEAWEEDFS_ADMIN_PORT}:23646"
    depends_on:
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started
      seaweedfs-filer:
        condition: service_started

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:

  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data: